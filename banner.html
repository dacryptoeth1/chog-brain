<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chog vs Chog banner</title>
<style>
  :root{--pri:#836ef9;--ink:#f6f2ff;--gold:#ffd166}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#07050f;overflow:hidden}
  body{display:grid;place-items:center;font-family:"Impact","Arial Black",system-ui,sans-serif}
  #wrap{width:1200px;height:630px;transform-origin:center;flex:none}
  #stage{position:relative;width:1200px;height:630px;overflow:hidden;color:var(--ink);
    background:
      radial-gradient(600px 400px at 50% 55%,#4a2fb8 0%,transparent 70%),
      radial-gradient(500px 300px at 8% 0%,#2b1a73 0%,transparent 70%),
      radial-gradient(500px 300px at 92% 100%,#5b1d7a 0%,transparent 70%),
      #0e0b1a}
  /* speed lines */
  #stage:before{content:"";position:absolute;inset:-50%;
    background:repeating-conic-gradient(from 0deg at 50% 54%,#ffffff0d 0 2deg,transparent 2deg 9deg);
    mask:radial-gradient(circle at 50% 54%,transparent 120px,#000 420px)}
  /* floor grid */
  #floor{position:absolute;left:-10%;right:-10%;bottom:-8px;height:170px;
    background:
      linear-gradient(#836ef955 1px,transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg,#836ef955 1px,transparent 1px) 0 0/60px 100%;
    transform:perspective(300px) rotateX(58deg);transform-origin:bottom;
    mask:linear-gradient(transparent,#000 70%)}
  .title{position:absolute;top:26px;left:0;right:0;text-align:center;letter-spacing:.35em;font-size:20px;color:#cfc6ff}
  .title b{color:var(--gold)}
  .fighter{position:absolute;top:92px;width:350px}
  .fighter.l{left:70px;transform:rotate(-3deg)} .fighter.r{right:70px;transform:rotate(3deg)}
  .frame{position:relative;width:350px;height:350px;border-radius:22px;overflow:hidden;background:#120e24;
    border:4px solid var(--pri);box-shadow:0 0 0 3px #0e0b1a,0 0 40px #836ef9aa,0 24px 50px #000a}
  .r .frame{border-color:#ff6bd6;box-shadow:0 0 0 3px #0e0b1a,0 0 40px #ff6bd699,0 24px 50px #000a}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph{position:absolute;inset:0;display:grid;place-items:center;color:#836ef9;font-size:15px;letter-spacing:.2em;text-align:center;padding:20px}
  .tag{position:relative;margin:-22px auto 0;width:270px;text-align:center;padding:10px 0 8px;font-size:34px;letter-spacing:.06em;
    background:linear-gradient(#836ef9,#5a44d6);border-radius:12px;box-shadow:0 8px 20px #0009;text-shadow:0 3px 0 #2c1d86}
  .r .tag{background:linear-gradient(#ff6bd6,#c23aa6);text-shadow:0 3px 0 #6b1458}
  #swords{position:absolute;left:50%;top:150px;width:400px;height:400px;margin-left:-200px;filter:drop-shadow(0 0 14px #836ef9)}
  .vs{position:absolute;left:50%;top:205px;width:124px;height:124px;margin-left:-62px;border-radius:50%;display:grid;place-items:center;
    font-size:60px;color:#fff;background:radial-gradient(circle at 35% 30%,#ffe08a,#ff9f1c 55%,#c2410c);
    box-shadow:0 0 0 6px #0e0b1a,0 0 50px #ffb703,0 14px 30px #000b;text-shadow:0 4px 0 #8a3a05;transform:rotate(-6deg)}
  .foot{position:absolute;bottom:20px;left:0;right:0;text-align:center}
  .foot .big{font-size:26px;letter-spacing:.14em}
  .foot .big em{color:#7dd3fc;font-style:normal}
  .foot .url{margin-top:2px;font:600 15px system-ui,sans-serif;letter-spacing:.08em;color:#a99fcf}
  .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px #836ef9}
</style></head>
<body>
<div id="wrap"><div id="stage">
  <div class="title">CHOGATHON 2026 · <b>CHOG BRAIN</b></div>
  <div id="floor"></div>

  <div class="fighter l">
    <div class="frame"><div class="ph">CHOG ART LOADS HERE<br>(needs internet)</div><img id="ia" alt=""></div>
    <div class="tag" id="ta">CHOG #1</div>
  </div>

  <svg id="swords" viewBox="0 0 400 400">
    <defs>
      <linearGradient id="bl" x1="0" x2="1"><stop offset="0" stop-color="#9aa4d8"/><stop offset=".5" stop-color="#f4f6ff"/><stop offset="1" stop-color="#8d96cc"/></linearGradient>
      <g id="sw">
        <polygon points="-12,-170 12,-170 8,-185 0,-205 -8,-185" fill="url(#bl)" stroke="#2b2f55" stroke-width="3"/>
        <rect x="-12" y="-170" width="24" height="170" fill="url(#bl)" stroke="#2b2f55" stroke-width="3"/>
        <line x1="0" y1="-165" x2="0" y2="-10" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
        <rect x="-44" y="0" width="88" height="14" rx="7" fill="#ffd166" stroke="#7a4b00" stroke-width="3"/>
        <rect x="-8" y="14" width="16" height="50" rx="5" fill="#4b2f9e" stroke="#1c1140" stroke-width="3"/>
        <circle cx="0" cy="72" r="11" fill="#ff6bd6" stroke="#1c1140" stroke-width="3"/>
      </g>
    </defs>
    <g transform="translate(200 250) rotate(-46) scale(1.3)"><use href="#sw"/></g>
    <g transform="translate(200 250) rotate(46) scale(1.3)"><use href="#sw"/></g>
  </svg>
  <div class="vs">VS</div>

  <div class="fighter r">
    <div class="frame"><div class="ph">CHOG ART LOADS HERE<br>(needs internet)</div><img id="ib" alt=""></div>
    <div class="tag" id="tb">CHOG #2</div>
  </div>

  <div class="foot"><div class="big">YOUR CHOG IS A CHARACTER. FIGHT. WIN. <em>OR CRY.</em></div><div class="url">chog-brain.vercel.app</div></div>
</div></div>
<script>
  const q = new URLSearchParams(location.search), a = q.get('a') || '1', b = q.get('b') || '2';
  const base = q.get('base') || 'https://chog-brain.vercel.app';
  for (const [id, n, t] of [['ia', a, 'ta'], ['ib', b, 'tb']]) {
    document.getElementById(t).textContent = 'CHOG #' + n;
    const el = document.getElementById(id);
    el.onerror = () => el.remove();
    el.src = base + '/api/chog/' + n + '/image';
  }
  // sparkles
  const st = document.getElementById('stage');
  for (let i = 0; i < 26; i++) { const s = document.createElement('i'); s.className = 'spark';
    s.style.left = Math.random() * 1200 + 'px'; s.style.top = Math.random() * 600 + 'px'; s.style.opacity = .2 + Math.random() * .7;
    s.style.transform = 'scale(' + (.5 + Math.random() * 1.2) + ')'; st.appendChild(s); }
  function fit() { const k = Math.min(innerWidth / 1200, innerHeight / 630); document.getElementById('wrap').style.transform = 'scale(' + k + ')'; }
  addEventListener('resize', fit); fit();
</script>
</body></html>
