<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chog Brain</title>
<style>
  :root { --bg:#0e0b1a; --card:#1a1530; --line:#2f2755; --ink:#f2eefc; --mute:#a99fcf; --pri:#836ef9; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --gold:#ffd166; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(900px 500px at 50% -10%, #2a1a6a55, transparent), var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; min-height:100vh; }
  main { max-width:760px; margin:0 auto; padding:14px; }
  h1 { margin:6px 0 0; font-size:28px; letter-spacing:.02em; } .sub { color:var(--mute); margin:0 0 14px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { background:#120e24; border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:10px; width:100px; font-size:16px; }
  button { background:var(--pri); color:#fff; border:0; border-radius:10px; padding:10px 14px; font-size:16px; cursor:pointer; min-height:44px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #snd { white-space:nowrap; flex:none; padding:8px 12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media(max-width:560px){ .grid{ grid-template-columns:1fr; } }
  .bar { height:8px; background:#120e24; border-radius:6px; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--pri); }
  .stat { display:flex; justify-content:space-between; font-size:14px; color:var(--mute); margin-top:6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; } .tag { font-size:12px; background:#120e24; border:1px solid var(--line); border-radius:99px; padding:2px 8px; color:var(--mute); }
  pre { white-space:pre-wrap; font:inherit; margin:0; }
  .note { font-size:13px; color:var(--warn); } .good { color:var(--ok); } .bad { color:var(--bad); }
  .hidden { display:none !important; }

  /* ---------- lobby card art ---------- */
  .hero { display:flex; align-items:flex-end; gap:6px; margin-bottom:10px; }
  .portrait { position:relative; width:150px; height:150px; border-radius:14px; background:#120e24; overflow:hidden; flex:none; }
  .portrait .ph { position:absolute; inset:0; padding:12px; } .portrait .ph svg { width:100%; height:100%; }
  .portrait img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s; }
  .sword { height:190px; width:57px; transform:rotate(14deg); transform-origin:50% 90%; flex:none; margin-left:-4px; }
  .sword svg { display:block; width:100%; height:100%; }
  .sword.glow { filter:drop-shadow(0 0 8px #836ef9); }
  .swordname { font-size:12px; color:var(--mute); margin:0 0 8px; }

  /* ---------- crying / winning (used on every card) ---------- */
  .badge { display:none; font-size:12px; font-weight:600; border-radius:99px; padding:2px 10px; margin-left:6px; }
  .tears { position:absolute; inset:0; pointer-events:none; display:none; }
  .tear { position:absolute; width:9px; height:14px; background:#7dd3fc; border-radius:50% 50% 50% 50% / 62% 62% 38% 38%; opacity:0; animation:drip 1.2s ease-in infinite; }
  .tear:nth-child(1){ left:34%; top:46%; } .tear:nth-child(2){ left:60%; top:46%; animation-delay:.3s; }
  .tear:nth-child(3){ left:30%; top:50%; animation-delay:.6s; } .tear:nth-child(4){ left:64%; top:50%; animation-delay:.9s; }
  @keyframes drip { 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:.95; } 100%{ transform:translateY(62px); opacity:0; } }
  @keyframes sob { 0%,100%{ transform:translateY(0) rotate(0); } 25%{ transform:translateY(2px) rotate(-1deg); } 75%{ transform:translateY(3px) rotate(1deg); } }
  @keyframes hop { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  .mood-cry .portrait { background:#0f1730; }
  .mood-cry .portrait img { filter:saturate(.55) brightness(.82) hue-rotate(-12deg); }
  .mood-cry .portrait .art { animation:sob 1.4s ease-in-out infinite; }
  .mood-cry .tears { display:block; }
  .mood-cry .badge.lose { display:inline-block; background:#0f2a44; color:#7dd3fc; }
  .mood-win .portrait { box-shadow:0 0 0 2px var(--ok), 0 0 18px #4ade8066; }
  .mood-win .portrait .art { animation:hop .7s ease-in-out 3; }
  .mood-win .badge.win { display:inline-block; background:#0f3a24; color:var(--ok); }

  /* ---------- game: mode buttons ---------- */
  .modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  @media(max-width:560px){ .modes{ grid-template-columns:1fr; } }
  .mode { text-align:left; padding:14px; border-radius:14px; background:linear-gradient(135deg,#3b2a9a,#251a63); border:1px solid #5b49d6; }
  .mode b { display:block; font-size:18px; } .mode span { font-size:13px; color:#cfc6ff; }
  .mode.boss { background:linear-gradient(135deg,#8a1d4a,#4a1230); border-color:#e0457b; }
  .mode.boss span { color:#ffc2d6; }

  /* ---------- game: battle screen ---------- */
  .hud { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .hud b { font-size:18px; } .pill { font-size:12px; background:#120e24; border:1px solid var(--line); border-radius:99px; padding:3px 10px; color:var(--mute); }
  .bossb { font-size:11px; font-weight:700; background:#e0457b; color:#fff; border-radius:6px; padding:1px 6px; vertical-align:middle; }
  /* side-view arena scene */
  .scene { position:relative; width:100%; aspect-ratio:16/11; overflow:hidden; border-radius:14px; border:3px solid #0b0816; box-shadow:0 0 0 2px var(--line);
    --s1:#5db8f5; --s2:#d9f2ff; --m1:#86b97a; --m2:#5f9a58; --g1:#63c24f; --g2:#8c6a3c; background:linear-gradient(var(--s1), var(--s2) 70%); image-rendering:pixelated; }
  @media (max-width:560px) { .scene { aspect-ratio:10/9; } }
  .scene.theme-1 { --s1:#ff8a4c; --s2:#ffe0a3; --m1:#b5607a; --m2:#8a4565; --g1:#9bb544; --g2:#7a4a35; }
  .scene.theme-2 { --s1:#14123f; --s2:#4a3a9a; --m1:#2d2c72; --m2:#221f5c; --g1:#4f9a74; --g2:#3b2c52; }
  .scene.theme-3 { --s1:#ff7fcf; --s2:#ffe6f4; --m1:#c58ad8; --m2:#9a63b8; --g1:#6bd0a8; --g2:#7a5a7a; }
  .scene.theme-boss { --s1:#4a0b25; --s2:#d4541c; --m1:#5b1f2c; --m2:#3b1220; --g1:#a8452e; --g2:#3a1a18; }
  .scene.theme-2:before { content:""; position:absolute; inset:0 0 40% 0; background:radial-gradient(2px 2px at 12% 20%,#fff,transparent),radial-gradient(2px 2px at 40% 12%,#fff,transparent),radial-gradient(2px 2px at 70% 26%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 10%,#fff,transparent),radial-gradient(1.5px 1.5px at 25% 34%,#fff,transparent); }
  .scene svg.mtn { position:absolute; left:0; bottom:24%; width:100%; height:46%; }
  .scene .cloud { position:absolute; height:16px; width:70px; border-radius:99px; background:#fffc; box-shadow:22px -8px 0 4px #fffc, 44px 0 0 0 #fffc; animation:drift 40s linear infinite; }
  .scene .cloud.c1 { top:16%; left:-20%; } .scene .cloud.c2 { top:30%; left:-60%; animation-duration:60s; transform:scale(.7); }
  .scene.theme-2 .cloud, .scene.theme-boss .cloud { opacity:.25; }
  @keyframes drift { to { transform:translateX(160vw); } }
  .scene .ground { position:absolute; left:0; right:0; bottom:0; height:26%; background:linear-gradient(var(--g1) 0 16%, var(--g2) 16%); border-top:3px solid #0004; }
  .scene .ground:before { content:""; position:absolute; left:0; right:0; top:-11px; height:12px; background:radial-gradient(circle at 9px 12px, var(--g1) 7px, transparent 8px) 0 0/18px 12px repeat-x; }
  .scene .ground:after { content:""; position:absolute; inset:16% 0 0 0; background:repeating-linear-gradient(90deg,#0003 0 2px,transparent 2px 26px),repeating-linear-gradient(0deg,#0002 0 2px,transparent 2px 22px); }
  .stagetag { position:absolute; top:62px; left:0; right:0; text-align:center; font:800 12px ui-monospace,Menlo,monospace; letter-spacing:.25em; color:#fff; text-shadow:0 2px 0 #000a; z-index:4; }
  .stagetag.bossed { color:#ffb3c9; }
  .hudbar { position:absolute; top:8px; width:46%; display:flex; align-items:center; gap:6px; z-index:5; }
  .hudbar.p { left:8px; } .hudbar.e { right:8px; flex-direction:row-reverse; }
  .hudbar .face { position:relative; width:46px; height:46px; border-radius:50%; border:3px solid #fff; background:#120e24; overflow:hidden; flex:none; box-shadow:0 2px 0 #0008; }
  .hudbar .face .ph { position:absolute; inset:0; padding:4px; } .hudbar .face .ph svg { width:100%; height:100%; }
  .hudbar .face img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .3s; }
  .hudbar .meta { flex:1; min-width:0; }
  .hname { font:800 11px ui-monospace,Menlo,monospace; letter-spacing:.08em; color:#fff; text-shadow:-1px 0 #000,1px 0 #000,0 -1px #000,0 1px #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hudbar.e .hname { text-align:right; }
  .hp { position:relative; height:16px; background:#2b1b12; border-radius:9px; overflow:hidden; margin:3px 0 0; border:2px solid #fff; box-shadow:0 2px 0 #0008; }
  .hp i { position:absolute; inset:0 auto 0 0; width:100%; background:var(--ok); transition:width .5s ease, background .3s; }
  .hudbar.e .hp i { inset:0 0 0 auto; }
  .hp span { position:absolute; inset:0; text-align:center; font-size:11px; line-height:12px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000; }
  .sprite { position:absolute; bottom:19%; width:30%; z-index:3; }
  .sprite.p { left:9%; } .sprite.e { right:9%; }
  .sprite:after { content:""; position:absolute; left:6%; right:6%; bottom:-9px; height:11px; background:#0007; border-radius:50%; filter:blur(2px); z-index:-1; }
  .stagebox { position:relative; transition:transform .2s ease-out; }
  .stagebox .portrait { width:100%; height:auto; aspect-ratio:1/1; border-radius:14px; border:3px solid #fff; box-shadow:0 5px 0 #0006; animation:bob 1.8s ease-in-out infinite; }
  .sprite.e .stagebox .portrait { animation-delay:.9s; border-color:#ffd1e3; }
  @keyframes bob { 0%,100%{ translate:0 0; } 50%{ translate:0 -3px; } }
  .fx { position:absolute; inset:0; pointer-events:none; overflow:visible; }
  .float { position:absolute; left:50%; top:20%; transform:translateX(-50%); font-weight:900; font-size:26px; color:#fff; text-shadow:0 2px 0 #000,0 0 8px #000; animation:floatup 1s ease-out forwards; white-space:nowrap; z-index:8; }
  .float.crit { color:var(--gold); font-size:34px; } .float.heal { color:var(--ok); } .float.miss, .float.block { color:#cbd5e1; font-size:18px; }
  @keyframes floatup { 0%{ transform:translate(-50%,10px) scale(.6); opacity:0; } 15%{ opacity:1; transform:translate(-50%,0) scale(1.15); } 100%{ transform:translate(-50%,-64px) scale(1); opacity:0; } }
  .lunge-p .stagebox, .sprite.p.lunge-p .stagebox { transform:translateX(70%) scale(1.06); }
  .sprite.e.lunge-e .stagebox { transform:translateX(-70%) scale(1.06); }
  @keyframes hurt { 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-7px); } 40%{ transform:translateX(7px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(5px); } }
  .hurt { animation:hurt .35s; } .hurt .portrait { filter:brightness(1.9) saturate(1.4); }
  .shield .portrait { box-shadow:0 0 0 3px #7dd3fc, 0 0 22px #7dd3fcaa; }
  .flash { animation:flash .4s; } @keyframes flash { 0%{ box-shadow:0 0 0 0 #ffd166; } 100%{ box-shadow:0 0 0 0 transparent; } }
  .burst { position:absolute; left:50%; top:40%; width:70px; height:70px; margin:-35px 0 0 -35px; z-index:7; animation:burst .4s ease-out forwards;
    background:conic-gradient(from 0deg,#fff 0 8deg,transparent 8deg 30deg,#ffd166 30deg 38deg,transparent 38deg 60deg,#fff 60deg 68deg,transparent 68deg 90deg,#ffd166 90deg 98deg,transparent 98deg 120deg,#fff 120deg 128deg,transparent 128deg 150deg,#ffd166 150deg 158deg,transparent 158deg 180deg,#fff 180deg 188deg,transparent 188deg 210deg,#ffd166 210deg 218deg,transparent 218deg 240deg,#fff 240deg 248deg,transparent 248deg 270deg,#ffd166 270deg 278deg,transparent 278deg 300deg,#fff 300deg 308deg,transparent 308deg 330deg,#ffd166 330deg 338deg,transparent 338deg);
    -webkit-mask:radial-gradient(circle,transparent 8px,#000 9px,#000 33px,transparent 35px); mask:radial-gradient(circle,transparent 8px,#000 9px,#000 33px,transparent 35px); }
  .burst.big { width:120px; height:120px; margin:-60px 0 0 -60px; -webkit-mask:radial-gradient(circle,transparent 12px,#000 13px,#000 58px,transparent 60px); mask:radial-gradient(circle,transparent 12px,#000 13px,#000 58px,transparent 60px); }
  @keyframes burst { 0%{ transform:scale(.3) rotate(0); opacity:1; } 100%{ transform:scale(1.35) rotate(40deg); opacity:0; } }
  .slash { position:absolute; left:20%; top:12%; width:60%; height:70%; border-radius:50%; border:5px solid transparent; border-top-color:#fff; border-right-color:#cfe9ff; transform:rotate(-30deg); animation:slash .3s ease-out forwards; z-index:7; filter:drop-shadow(0 0 6px #7dd3fc); }
  @keyframes slash { 0%{ transform:rotate(-70deg) scale(.6); opacity:0; } 40%{ opacity:1; } 100%{ transform:rotate(20deg) scale(1.1); opacity:0; } }
  .beam { position:absolute; top:46%; height:12%; z-index:4; border-radius:99px; background:linear-gradient(90deg,#fff,#c154e6 40%,#836ef9); box-shadow:0 0 18px #c154e6,0 0 36px #836ef9; animation:beam .6s ease-out forwards; }
  .beam.bp { left:34%; width:34%; transform-origin:left; } .beam.be { right:34%; width:34%; transform-origin:right; background:linear-gradient(270deg,#fff,#ff6bd6 40%,#e0457b); box-shadow:0 0 18px #ff6bd6,0 0 36px #e0457b; }
  @keyframes beam { 0%{ transform:scaleX(0); opacity:1; } 55%{ transform:scaleX(1); opacity:1; } 100%{ transform:scaleX(1); opacity:0; } }
  .shake { animation:shake .3s; } @keyframes shake { 0%,100%{ transform:translate(0); } 25%{ transform:translate(-4px,2px); } 50%{ transform:translate(4px,-2px); } 75%{ transform:translate(-3px,-1px); } }

  /* character moves: jump, punch, beam, dodge */
  .jumping .stagebox { animation:jump .7s cubic-bezier(.3,.6,.4,1); }
  @keyframes jump { 0%{ translate:0 0; rotate:0deg; } 18%{ translate:0 4%; } 50%{ translate:0 -62%; rotate:-6deg; } 80%{ translate:0 -62%; } 100%{ translate:0 0; rotate:0deg; } }
  .dodge.p .stagebox { animation:dodgeP .48s ease-out; } .dodge.e .stagebox { animation:dodgeE .48s ease-out; }
  @keyframes dodgeP { 0%,100%{ translate:0 0; rotate:0deg; } 40%{ translate:-34% -34%; rotate:-14deg; } 70%{ translate:-20% -8%; rotate:-6deg; } }
  @keyframes dodgeE { 0%,100%{ translate:0 0; rotate:0deg; } 40%{ translate:34% -34%; rotate:14deg; } 70%{ translate:20% -8%; rotate:6deg; } }
  .knock.p .stagebox { animation:knockP .4s ease-out; } .knock.e .stagebox { animation:knockE .4s ease-out; }
  @keyframes knockP { 0%,100%{ translate:0 0; rotate:0deg; } 30%{ translate:-16% -6%; rotate:-9deg; } }
  @keyframes knockE { 0%,100%{ translate:0 0; rotate:0deg; } 30%{ translate:16% -6%; rotate:9deg; } }
  .crouch .stagebox { transform:scaleY(.86) scaleX(1.05); transform-origin:50% 100%; }
  .sprite.mood-win .stagebox { animation:joy .55s ease-out 3; }
  @keyframes joy { 0%,100%{ translate:0 0; } 45%{ translate:0 -42%; } }
  .fist { display:none; position:absolute; top:30%; width:38%; aspect-ratio:1/1; border-radius:50%; z-index:6; opacity:0;
    background:radial-gradient(circle at 35% 28%,#ff9aa5,#e0263f 55%,#8a1127); border:3px solid #2a0a12; box-shadow:0 3px 0 #0007; }
  .fist:before { content:""; position:absolute; top:22%; width:44%; height:56%; background:#fff; border:3px solid #2a0a12; border-radius:6px; }
  .fist.p { left:70%; animation:punchP .36s ease-out forwards; } .fist.p:before { right:92%; }
  .fist.e { right:70%; animation:punchE .36s ease-out forwards; } .fist.e:before { left:92%; }
  .fist.crit { width:48%; background:radial-gradient(circle at 35% 28%,#fff3b0,#ffc233 55%,#c27a00); box-shadow:0 0 18px #ffd166, 0 3px 0 #0007; }
  @keyframes punchP { 0%{ transform:translateX(-60%) scale(.5); opacity:0; } 35%{ transform:translateX(30%) scale(1.25); opacity:1; } 100%{ transform:translateX(10%) scale(1); opacity:0; } }
  @keyframes punchE { 0%{ transform:translateX(60%) scale(.5); opacity:0; } 35%{ transform:translateX(-30%) scale(1.25); opacity:1; } 100%{ transform:translateX(-10%) scale(1); opacity:0; } }
  .charge { position:absolute; top:36%; width:46%; aspect-ratio:1/1; border-radius:50%; z-index:6; background:radial-gradient(circle,#fff 0 20%,#e08bff 45%,#836ef9aa 70%,transparent 72%); animation:charge .5s ease-in forwards; filter:drop-shadow(0 0 10px #c154e6); }
  .charge.p { left:72%; } .charge.e { right:72%; background:radial-gradient(circle,#fff 0 20%,#ff8fc9 45%,#e0457baa 70%,transparent 72%); filter:drop-shadow(0 0 10px #ff6bd6); }
  @keyframes charge { 0%{ transform:scale(.2); opacity:0; } 60%{ transform:scale(1); opacity:1; } 100%{ transform:scale(1.4); opacity:0; } }
  .beam { top:40%; height:11%; }

  /* fighter body: the real NFT is the head, the body is a generic rigged fighter coloured from the token's traits */
  .sprite { container-type:inline-size; }
  .fig { position:relative; width:100%; aspect-ratio:1/1.5; }
  .sprite.e .fig { transform:scaleX(-1); }
  .sprite.glowy .fig { filter:drop-shadow(0 0 9px #836ef9); }
  .fig .portrait.head { position:absolute; left:17%; top:0; width:66%; height:auto; aspect-ratio:1/1; border-radius:18px; z-index:5; animation:headbob 1.8s ease-in-out infinite; }
  @keyframes headbob { 0%,100%{ translate:0 0; } 50%{ translate:0 -2%; } }
  .sprite.e .stagebox .portrait { border-color:#fff; }
  .torso { position:absolute; left:28%; top:38%; width:44%; height:27%; border-radius:12px 12px 8px 8px; background:var(--suit); border:3px solid #0b0816; z-index:2; }
  .torso:after { content:""; position:absolute; left:-3px; right:-3px; bottom:10%; height:24%; background:var(--trim); border-top:2px solid #0006; border-bottom:2px solid #0006; }
  .torso:before { content:""; position:absolute; left:34%; right:34%; top:14%; height:26%; border-radius:50%; background:var(--trim); opacity:.9; }
  .arm { position:absolute; top:41%; width:15%; height:27%; transform-origin:50% 9%; border-radius:8px; background:var(--limb); border:3px solid #0b0816; }
  .arm .glove { position:absolute; left:-18%; right:-18%; bottom:-12%; height:34%; border-radius:50%; background:var(--trim); border:3px solid #0b0816; }
  .arm.front { left:66%; z-index:3; animation:sway 1.8s ease-in-out infinite; }
  .arm.back { left:19%; z-index:4; rotate:20deg; animation:sway2 1.8s ease-in-out infinite; }
  @keyframes sway { 0%,100%{ rotate:6deg; } 50%{ rotate:-6deg; } }
  @keyframes sway2 { 0%,100%{ rotate:22deg; } 50%{ rotate:16deg; } }
  .arm.back .sword { position:absolute; left:50%; bottom:-6%; height:100cqw; width:auto; aspect-ratio:60/200; margin:0; transform:translateX(-50%) rotate(-24deg); transform-origin:50% 94%; }
  .leg { position:absolute; top:63%; width:18%; height:31%; transform-origin:50% 4%; border-radius:6px 6px 0 0; background:var(--limb); border:3px solid #0b0816; z-index:1; }
  .leg .boot { position:absolute; left:-20%; right:-34%; bottom:-6%; height:30%; border-radius:8px 14px 4px 4px; background:var(--dark); border:3px solid #0b0816; }
  .leg.front { left:51%; z-index:2; } .leg.back { left:31%; }
  /* moves */
  .punching .arm.front { animation:armPunch .36s ease-out; }
  @keyframes armPunch { 0%{ rotate:10deg; scale:1; } 35%{ rotate:-92deg; scale:1 1.35; } 100%{ rotate:6deg; scale:1; } }
  .punching.crit .arm.front .glove { background:#ffd166; box-shadow:0 0 14px #ffd166; }
  .lunge-p .leg.front, .lunge-e .leg.front { rotate:-30deg; } .lunge-p .leg.back, .lunge-e .leg.back { rotate:28deg; }
  .jumping .leg.front { animation:tuckF .7s; } .jumping .leg.back { animation:tuckB .7s; }
  @keyframes tuckF { 0%,100%{ rotate:0deg; } 30%,80%{ rotate:-50deg; } } @keyframes tuckB { 0%,100%{ rotate:0deg; } 30%,80%{ rotate:35deg; } }
  .casting .arm.front { animation:armCast .85s ease-out forwards; } .casting .arm.back { animation:armCast2 .85s ease-out forwards; }
  @keyframes armCast { 0%{ rotate:6deg; } 25%,85%{ rotate:-90deg; } 100%{ rotate:6deg; } }
  @keyframes armCast2 { 0%{ rotate:20deg; } 25%,85%{ rotate:-80deg; } 100%{ rotate:20deg; } }
  .crouch .arm.front { animation:none; rotate:-150deg; } .crouch .arm.back { animation:none; rotate:-140deg; }
  .crouch .leg { rotate:0deg; }
  .dead .fig { rotate:6deg; } .dead .portrait.head { translate:0 6%; rotate:9deg; animation:none; }
  .dead .arm { animation:none !important; rotate:4deg; } .dead .arm.back .sword { opacity:.35; }
  .sprite.mood-win .arm.front { animation:cheer .5s ease-in-out infinite alternate; }
  @keyframes cheer { 0%{ rotate:-150deg; } 100%{ rotate:-170deg; } }
  .banner { position:absolute; left:0; right:0; top:34%; text-align:center; font-weight:900; font-size:34px; letter-spacing:.1em; color:#fff; text-shadow:0 0 18px #e0457b, 0 3px 0 #000; animation:banner 1.6s ease-out forwards; pointer-events:none; z-index:6; }
  @keyframes banner { 0%{ transform:scale(2.2); opacity:0; } 20%{ transform:scale(1); opacity:1; } 80%{ opacity:1; } 100%{ opacity:0; } }
  .moves { display:grid; grid-template-columns:1fr 1.3fr 1fr; gap:8px; margin:12px 0 8px; }
  .moves button { padding:10px 6px; min-height:58px; line-height:1.2; border-radius:12px; font-weight:700; }
  .moves button small { display:block; font-weight:400; font-size:11px; opacity:.85; }
  #mAtk { background:#d9485f; } #mSp { background:linear-gradient(135deg,#836ef9,#c154e6); } #mGd { background:#2b82c9; }
  .log { min-height:66px; background:#120e24; border:1px solid var(--line); border-radius:12px; padding:8px 10px; font-size:14px; color:var(--mute); }
  .log div:last-child { color:var(--ink); }
  .result { text-align:center; margin-top:12px; }
  .result h2 { margin:4px 0; font-size:26px; } .result .big { font-size:34px; font-weight:900; color:var(--gold); }
  .result .row { justify-content:center; margin-top:10px; }
  .kv { display:flex; justify-content:center; gap:18px; flex-wrap:wrap; color:var(--mute); font-size:14px; margin-top:6px; } .kv b { color:var(--ink); }
  @media (prefers-reduced-motion: reduce) { .jumping .stagebox, .dodge .stagebox, .knock .stagebox, .sprite.mood-win .stagebox, .fist, .charge, .stagebox .portrait, .scene .cloud, .tear, .mood-cry .portrait .art, .mood-win .portrait .art, .float, .banner { animation:none; } .tear { opacity:.9; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Chog Brain</h1><p class="sub" style="margin:0">Your Chog is a fighter. Its traits are its stats.</p></div>
    <button id="snd" class="ghost" title="Sound effects">Sound: on</button>
  </div>

  <!-- ===== lobby ===== -->
  <div id="lobby">
    <div class="card" style="margin-top:12px">
      <div class="row">
        <button id="connect" class="ghost">Connect wallet</button>
        <span id="wallet" class="sub" style="margin:0">Not connected (demo mode: any Chog works)</span>
      </div>
      <div class="row" style="margin-top:10px">
        <label>Your Chog # <input id="mine" type="number" min="1" max="1969" value="1"></label>
        <button id="load">Load my Chog</button>
      </div>
      <p id="status" class="note" style="margin:8px 0 0"></p>
    </div>

    <div id="mine-card"></div>

    <div id="modes" class="modes hidden">
      <button class="mode" id="goArena"><b>Arena run</b><span>Beat Chog after Chog. Every 5th is a boss. How far can you get?</span></button>
      <button class="mode boss" id="goDaily"><b>Daily boss</b><span id="dailySub">One fight a day. Same boss for everyone.</span></button>
    </div>

    <div id="more" class="card hidden" style="margin-top:14px">
      <div class="row">
        <button id="run" class="ghost">Daily expedition (free XP)</button>
        <label>Opponent # <input id="foe" type="number" min="1" max="1969" value="2"></label>
        <button id="duel" class="ghost">Narrated duel</button>
      </div>
      <div id="fighters" class="grid" style="margin-top:12px"></div>
      <div id="story" class="card" style="display:none;margin:12px 0 0"><pre id="storyText"></pre><p id="by" class="sub" style="margin:6px 0 0"></p></div>
    </div>
  </div>

  <!-- ===== battle ===== -->
  <div id="battle" class="hidden">
    <div class="hud">
      <div><b id="hudTitle">Stage 1</b> <span id="hudBoss" class="bossb hidden">BOSS</span></div>
      <div class="row"><span class="pill" id="hudScore">Score 0</span><span class="pill" id="hudBest"></span><button class="ghost" id="quit" style="min-height:34px;padding:4px 10px;font-size:13px">Quit</button></div>
    </div>
    <div class="scene" id="arena"></div>
    <div class="moves">
      <button id="mAtk">Punch<small>reliable hit</small></button>
      <button id="mSp">Jump + Beam<small id="spName"></small></button>
      <button id="mGd">Guard<small>block + heal</small></button>
    </div>
    <div class="log" id="log"></div>
    <div id="result" class="card result hidden"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let account = null, me = null, run = null, battle = null;

async function api(path, body) {
  const r = await fetch(path, body !== undefined ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  let j; try { j = await r.json(); } catch { throw new Error('Server error, please try again.'); }
  if (!r.ok) throw new Error(j.error || 'request failed');
  return j;
}

// ---------- sound effects (synthesized, no audio files) ----------
const sfx = (() => {
  let ctx = null, on = true;
  const ensure = () => { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } } if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(freq, dur, { type = 'sine', vol = 0.15, at = 0, slide = 0 } = {}) {
    const c = ensure(); if (!c || !on) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, { vol = 0.2, at = 0, hp = 1500 } = {}) {
    const c = ensure(); if (!c || !on) return;
    const t = c.currentTime + at, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(t);
  }
  return {
    toggle() { on = !on; if (on) ensure(); return on; },
    unlock: ensure,
    clash() { noise(0.12, { vol: 0.25, hp: 3000 }); tone(1200, 0.18, { type: 'triangle', vol: 0.12, slide: -300 }); tone(1800, 0.12, { type: 'square', vol: 0.05, at: 0.01 }); },
    hit() { noise(0.1, { vol: 0.3, hp: 600 }); tone(140, 0.16, { type: 'sawtooth', vol: 0.2, slide: -80 }); },
    crit() { this.hit(); tone(880, 0.1, { type: 'square', vol: 0.1, at: 0.05 }); tone(1320, 0.18, { type: 'square', vol: 0.1, at: 0.12 }); },
    special() { tone(220, 0.35, { type: 'sawtooth', vol: 0.14, slide: 900 }); noise(0.25, { vol: 0.2, at: 0.25, hp: 500 }); tone(110, 0.25, { type: 'square', vol: 0.18, at: 0.3, slide: -60 }); },
    guard() { tone(300, 0.12, { type: 'triangle', vol: 0.14 }); tone(450, 0.2, { type: 'triangle', vol: 0.12, at: 0.08 }); },
    dodge() { noise(0.18, { vol: 0.12, hp: 4000 }); tone(500, 0.18, { type: 'sine', vol: 0.08, slide: 700 }); },
    boss() { tone(90, 0.7, { type: 'sawtooth', vol: 0.2, slide: -30 }); tone(135, 0.7, { type: 'square', vol: 0.1, at: 0.1, slide: -40 }); },
    win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.28, { type: 'triangle', vol: 0.16, at: i * 0.13 })); },
    cry() { [392, 370, 330, 294].forEach((f, i) => tone(f, 0.4, { type: 'sine', vol: 0.14, at: i * 0.3, slide: -25 })); tone(900, 0.25, { type: 'sine', vol: 0.05, at: 0.1, slide: -200 }); },
  };
})();
$('snd').onclick = () => { $('snd').textContent = 'Sound: ' + (sfx.toggle() ? 'on' : 'off'); };

// ---------- shared Chog card (lobby + narrated duel) ----------
let mood = {}; // tokenId -> 'win' | 'cry' for the narrated duel
function card(b, nft, p, art) {
  const m = mood[b.tokenId] || '';
  const stats = Object.entries(b.stats).map(([k, v]) =>
    `<div class="stat"><span>${k}</span><span>${v}</span></div><div class="bar"><i style="width:${Math.min(100, v * 3)}%"></i></div>`).join('');
  const tags = Object.entries(b.traits).slice(0, 8).map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join('');
  const ph = m === 'cry' ? art.placeholderCry : art.placeholder;
  return `<div class="card ${m ? 'mood-' + m : ''}" style="margin-bottom:0">
    <div class="hero">
      <div class="portrait">
        <div class="art" style="position:absolute;inset:0">
          <div class="ph">${ph}</div>${nft.image ? `<img src="${esc(nft.image)}" alt="Chog #${esc(b.tokenId)}" decoding="async" onload="this.style.opacity=1" onerror="this.remove()">` : ''}
        </div>
        <div class="tears"><i class="tear"></i><i class="tear"></i><i class="tear"></i><i class="tear"></i></div>
      </div>
      <div class="sword ${art.sword.glow ? 'glow' : ''}">${art.sword.svg}</div>
    </div>
    <p class="swordname">Sword: ${esc(art.sword.name)}</p>
    <strong>Chog #${esc(b.tokenId)}</strong> · Lv ${p.level} · ${esc(b.personality.temperament)}
    <span class="badge win">Winner</span><span class="badge lose">Defeated</span>
    <div class="sub" style="margin:0">${esc(b.personality.quirk)}</div>
    <div class="stat"><span>HP</span><span>${b.hp}</span></div>${stats}
    <div class="stat"><span>Signature</span><span>${esc(b.signatureMove)}</span></div>
    <div class="stat"><span>Record</span><span>${p.wins}W / ${p.losses}L · ${p.xp} XP</span></div>
    ${p.bestStage ? `<div class="stat"><span>Best arena run</span><span>Stage ${p.bestStage} · ${p.bestScore} pts</span></div>` : ''}
    <div class="tags">${tags}</div>
    ${nft.source === 'fallback' ? `<p class="note">Showing seeded traits and placeholder art. Chain read failed at ${esc(nft.reason || 'an unknown step')}.</p>` : ''}
  </div>`;
}

api('/api/health').then((h) => {
  if (!h.chain.reachable && !h.snapshot) $('wallet').insertAdjacentHTML('afterend', `<p class="note">Monad RPC unreachable from the server (${esc(h.chain.reason)}). Using seeded traits.</p>`);
  if (h.store === 'ephemeral') $('wallet').insertAdjacentHTML('afterend', '<p class="note">No database connected: XP and bests reset when the server restarts.</p>');
}).catch(() => {});

$('connect').onclick = async () => {
  if (!window.ethereum) { $('wallet').textContent = 'No wallet found. Demo mode still works.'; return; }
  try {
    const [a] = await window.ethereum.request({ method: 'eth_requestAccounts' });
    account = a; $('wallet').textContent = a.slice(0, 6) + '…' + a.slice(-4);
  } catch { $('wallet').textContent = 'Wallet connection cancelled.'; }
};

// ---------- lobby ----------
async function loadMe() {
  const id = $('mine').value;
  const d = await api('/api/chog/' + id);
  me = { id: String(id), ...d };
  $('mine-card').innerHTML = card(d.brain, d.nft, d.progress, d.art);
  const doneToday = d.progress.lastDaily === d.today;
  $('goDaily').disabled = doneToday;
  $('dailySub').textContent = doneToday ? 'Done for today. A new boss arrives at 00:00 UTC.' : 'One fight a day. Same boss for everyone. Bonus XP.';
  $('modes').classList.remove('hidden'); $('more').classList.remove('hidden');
}

$('load').onclick = async () => {
  sfx.unlock();
  $('status').textContent = 'Loading your Chog…'; $('status').className = 'note';
  try {
    await loadMe();
    if (account) {
      const v = await api('/api/verify', { tokenId: me.id, address: account });
      $('status').innerHTML = v.verified ? '<span class="good">Ownership verified onchain.</span>' : 'Not verified as owner (' + esc(v.reason || 'wallet does not own this token') + '). Playing in demo mode.';
    } else { $('status').textContent = 'Demo mode: connect a wallet that owns the Chog for verified play.'; }
  } catch (e) { $('status').textContent = e.message; }
};

// ---------- the game ----------
const sideKey = { player: 'p', enemy: 'e' };
const faceHTML = (f) => `<div class="ph">${f.art.placeholder}</div>${f.nft.image ? `<img src="${esc(f.nft.image)}" alt="" decoding="async" onload="this.style.opacity=1" onerror="this.remove()">` : ''}`;
const hudHTML = (side, f, isBoss) => `<div class="hudbar ${side}">
    <div class="face">${faceHTML(f)}</div>
    <div class="meta"><div class="hname">Chog #${esc(f.id)}${f.level ? ' · Lv ' + f.level : ''}${isBoss && side === 'e' ? ' · BOSS' : ''}</div>
    <div class="hp"><i id="hp-${side}"></i><span id="hpt-${side}"></span></div></div></div>`;
const hashStr = (str) => { let h = 2166136261; for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
// Body colours come from the token's own traits, so every Chog gets its own outfit.
function outfit(f) {
  const h = hashStr(Object.entries(f.brain.traits).map(([k, v]) => k + v).join('|') || f.id);
  const hue = h % 360, hue2 = (hue + 140 + (h >> 9) % 80) % 360;
  return `--suit:hsl(${hue} 62% 46%);--trim:hsl(${hue2} 80% 62%);--limb:hsl(${hue} 28% 74%);--dark:hsl(${hue} 45% 22%)`;
}
const spriteHTML = (side, f) => `<div class="sprite ${side} ${f.art.sword.glow ? 'glowy' : ''}" id="f-${side}" style="${outfit(f)}">
    <div class="stagebox" id="sb-${side}"><div class="fig">
      <div class="leg back"><i class="boot"></i></div><div class="leg front"><i class="boot"></i></div>
      <div class="arm back"><div class="sword ${f.art.sword.glow ? 'glow' : ''}">${f.art.sword.svg}</div><i class="glove"></i></div>
      <div class="torso"></div>
      <div class="arm front"><i class="glove"></i></div>
      <div class="portrait head"><div class="art" style="position:absolute;inset:0"><div class="ph" id="ph-${side}">${f.art.placeholder}</div>${f.nft.image ? `<img src="${esc(f.nft.image)}" alt="Chog #${esc(f.id)}" decoding="async" onload="this.style.opacity=1" onerror="this.remove()">` : ''}</div><div class="tears"><i class="tear"></i><i class="tear"></i><i class="tear"></i><i class="tear"></i></div></div>
    </div>
    <div class="fx" id="fx-${side}"></div></div></div>`;
const SCENERY = `<div class="cloud c1"></div><div class="cloud c2"></div>
  <svg class="mtn" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
    <polygon fill="var(--m1)" points="0,120 0,64 36,38 70,70 118,16 172,78 226,30 290,82 342,42 400,68 400,120"/>
    <polygon fill="var(--m2)" points="0,120 0,96 56,70 118,94 196,64 272,92 338,72 400,94 400,120"/>
  </svg><div class="ground"></div>`;
function sceneHTML(d) {
  const theme = d.boss ? 'theme-boss' : 'theme-' + ((d.stage - 1) % 4);
  const tag = d.mode === 'daily' ? 'DAILY BOSS' : (d.boss ? 'BOSS · STAGE ' + d.stage : 'STAGE ' + d.stage);
  $('arena').className = 'scene ' + theme;
  return SCENERY + `<div class="stagetag ${d.boss ? 'bossed' : ''}">${tag}</div>` + hudHTML('p', d.player, false) + hudHTML('e', d.enemy, d.boss) + spriteHTML('p', d.player) + spriteHTML('e', d.enemy);
}

function setHp(side, hp, max) {
  const pct = Math.max(0, Math.min(100, (hp / max) * 100));
  const bar = $('hp-' + side);
  bar.style.width = pct + '%';
  bar.style.background = pct > 50 ? 'var(--ok)' : pct > 25 ? 'var(--warn)' : 'var(--bad)';
  $('hpt-' + side).textContent = Math.max(0, hp) + ' / ' + max;
}
function logLine(t) { const l = $('log'); const d = document.createElement('div'); d.textContent = t; l.appendChild(d); while (l.children.length > 4) l.removeChild(l.firstChild); }
function floatText(side, text, cls) {
  const d = document.createElement('div'); d.className = 'float ' + cls; d.textContent = text; $('fx-' + side).appendChild(d); setTimeout(() => d.remove(), 1000);
}
function pulse(el, cls, ms) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
function fist(side, crit) { const d = document.createElement('div'); d.className = 'fist ' + side + (crit ? ' crit' : ''); $('fx-' + side).appendChild(d); setTimeout(() => d.remove(), 400); }
function charge(side) { const d = document.createElement('div'); d.className = 'charge ' + side; $('fx-' + side).appendChild(d); setTimeout(() => d.remove(), 550); }
function punch(side, crit) { const el = $('f-' + side); el.classList.toggle('crit', !!crit); pulse(el, 'lunge-' + side, 260); pulse(el, 'punching', 380); }
function burst(side, big) { const d = document.createElement('div'); d.className = 'burst' + (big ? ' big' : ''); $('fx-' + side).appendChild(d); setTimeout(() => d.remove(), 450); }
function slash(side) { const d = document.createElement('div'); d.className = 'slash'; $('fx-' + side).appendChild(d); setTimeout(() => d.remove(), 350); }
function beam(from) { const d = document.createElement('div'); d.className = 'beam b' + from; $('arena').appendChild(d); setTimeout(() => d.remove(), 650); }
function cryOn(side) {
  const f = $('f-' + side); f.classList.add('mood-cry', 'dead');
  const d = battle[side === 'p' ? 'player' : 'enemy'];
  $('ph-' + side).innerHTML = d.art.placeholderCry;
}
function celebrate(side) { $('f-' + side).classList.add('mood-win'); }

function updateMoves(enabled) {
  const cd = battle ? battle.state.p.cd : 0;
  $('mAtk').disabled = !enabled; $('mGd').disabled = !enabled;
  $('mSp').disabled = !enabled || cd > 0;
  $('spName').textContent = cd > 0 ? `ready in ${cd}` : battle.player.brain.signatureMove;
}

function drawHud() {
  $('hudTitle').textContent = battle.mode === 'daily' ? 'Daily boss' : 'Stage ' + battle.stage;
  $('hudBoss').classList.toggle('hidden', !battle.boss);
  $('hudScore').textContent = battle.mode === 'daily' ? 'One attempt' : 'Score ' + run.score;
  const nextBoss = 5 - (battle.stage % 5);
  $('hudBest').textContent = battle.mode === 'daily' ? '' : (battle.best.stage ? `Best: stage ${battle.best.stage}` : (battle.boss ? 'Boss fight' : `Boss in ${nextBoss}`));
}

async function startStage(mode, stage, hp) {
  const q = new URLSearchParams({ player: me.id, mode, stage: String(stage) });
  if (hp) q.set('hp', String(hp));
  const d = await api('/api/stage?' + q);
  battle = { ...d, busy: false, over: false };
  $('lobby').classList.add('hidden'); $('battle').classList.remove('hidden'); $('result').classList.add('hidden'); $('result').innerHTML = '';
  $('arena').innerHTML = sceneHTML(d);
  $('log').innerHTML = '';
  setHp('p', d.state.p.hp, d.state.p.max); setHp('e', d.state.e.hp, d.state.e.max);
  drawHud(); updateMoves(true);
  logLine(d.boss ? `BOSS FIGHT! Chog #${d.enemy.id} blocks the way.` : `Stage ${d.stage}: Chog #${d.enemy.id} wants a fight.`);
  if (d.boss) {
    const b = document.createElement('div'); b.className = 'banner'; b.textContent = 'BOSS'; $('arena').appendChild(b); setTimeout(() => b.remove(), 1700); sfx.boss();
  } else sfx.clash();
}

async function play(events) {
  const mv = (n) => n === 'special' ? battle[ 'player' ].brain.signatureMove : n;
  for (const ev of events) {
    const w = sideKey[ev.who], o = w === 'p' ? 'e' : 'p';
    const nameOf = (side) => 'Chog #' + battle[side === 'p' ? 'player' : 'enemy'].id;
    if (ev.type === 'guard') {
      pulse($('f-' + w), 'shield', 900); pulse($('f-' + w), 'crouch', 900); sfx.guard();
      if (ev.heal) floatText(w, '+' + ev.heal, 'heal');
      logLine(`${nameOf(w)} guards.`);
    } else if (ev.type === 'miss') {
      const sig = battle[w === 'p' ? 'player' : 'enemy'].brain.signatureMove;
      if (ev.move === 'special') { sfx.special(); pulse($('f-' + w), 'jumping', 700); await wait(280); pulse($('f-' + w), 'casting', 900); charge(w); await wait(260); beam(w); await wait(150); }
      else { punch(w, false); await wait(150); }
      pulse($('f-' + o), 'dodge', 480); sfx.dodge(); floatText(o, 'MISS', 'miss');
      logLine(`${nameOf(w)} used ${ev.move === 'special' ? sig : 'a punch'}... and missed!`);
    } else if (ev.type === 'hit') {
      const sp = ev.move === 'special';
      if (sp) {
        sfx.special(); pulse($('f-' + w), 'jumping', 700); await wait(280); pulse($('f-' + w), 'casting', 900); charge(w); await wait(260); beam(w); await wait(220);
        pulse($('arena'), 'shake', 320);
      } else {
        punch(w, ev.crit); await wait(170); ev.crit ? sfx.crit() : sfx.hit();
      }
      burst(o, sp || ev.crit);
      pulse($('f-' + o), 'hurt', 360); pulse($('f-' + o), 'knock', 400);
      floatText(o, '-' + ev.dmg, ev.crit ? 'crit' : '');
      if (ev.blocked) floatText(o, 'BLOCK', 'block');
      if (ev.crit) pulse($('f-' + o), 'flash', 400);
      const nm = sp ? battle[w === 'p' ? 'player' : 'enemy'].brain.signatureMove : 'a punch';
      logLine(`${nameOf(w)} lands ${nm} for ${ev.dmg}${ev.crit ? ' (CRIT!)' : ''}${ev.blocked ? ', mostly blocked' : ''}.`);
    } else if (ev.type === 'counter') {
      sfx.clash(); punch(w, false); floatText(o, '-' + ev.dmg, ''); logLine(`${nameOf(w)} counters for ${ev.dmg}!`);
    }
    setHp('p', ev.hp.p, battle.state.p.max); setHp('e', ev.hp.e, battle.state.e.max);
    await wait(650);
  }
}

async function takeTurn(move) {
  if (!battle || battle.busy || battle.over) return;
  battle.busy = true; updateMoves(false);
  try {
    const out = await api('/api/turn', { player: me.id, mode: battle.mode, stage: battle.stage, state: battle.state, move });
    await play(out.events);
    battle.state = out.state;
    setHp('p', out.state.p.hp, out.state.p.max); setHp('e', out.state.e.hp, out.state.e.max);
    if (out.over) { battle.over = true; await endBattle(out); }
    else updateMoves(true);
  } catch (e) { logLine(e.message); updateMoves(true); }
  battle.busy = false;
}
$('mAtk').onclick = () => takeTurn('attack');
$('mSp').onclick = () => takeTurn('special');
$('mGd').onclick = () => takeTurn('guard');

async function finishRun(won) {
  try { return await api('/api/finish', { player: me.id, mode: battle.mode, cleared: run.cleared, score: run.score, won }); } catch { return null; }
}

async function endBattle(out) {
  const won = out.winner === 'player';
  const R = $('result'); R.classList.remove('hidden');
  if (won) { cryOn('e'); celebrate('p'); sfx.win(); setTimeout(() => sfx.cry(), 900); } else { cryOn('p'); celebrate('e'); sfx.cry(); }

  if (battle.mode === 'arena' && won) {
    run.cleared = battle.stage; run.score += out.score;
    $('hudScore').textContent = 'Score ' + run.score;
    const nextIsBoss = (battle.stage + 1) % 5 === 0;
    R.innerHTML = `<div class="big">Stage ${battle.stage} cleared!</div><div class="kv"><span>+<b>${out.score}</b> pts</span><span>HP restored to <b>${out.nextHp}</b>/${out.state.p.max}</span></div>
      <p class="sub" style="margin:8px 0 0">${nextIsBoss ? 'Next up: a BOSS.' : 'Chog #' + battle.enemy.id + ' is crying. Next opponent incoming.'}</p>
      <div class="row"><button id="next">Next stage</button><button class="ghost" id="bank">Bank run &amp; leave</button></div>`;
    $('next').onclick = async () => { try { await startStage('arena', battle.stage + 1, out.nextHp); } catch (e) { logLine(e.message); } };
    $('bank').onclick = () => finishAndShow(true, 'Run banked');
    return;
  }
  if (battle.mode === 'arena') return finishAndShow(false, 'Run over');
  return finishAndShow(won, won ? 'Boss defeated!' : 'The boss wins');
}

async function finishAndShow(won, title) {
  const f = await finishRun(won);
  const R = $('result'); R.classList.remove('hidden');
  const daily = battle.mode === 'daily';
  const lost = !won && !daily ? true : !won;
  R.innerHTML = `<h2 class="${lost ? 'bad' : 'good'}">${esc(title)}</h2>
    ${lost ? `<p class="sub" style="margin:0">Chog #${esc(me.id)} is crying. 😭</p>` : ''}
    ${daily ? '' : `<div class="big">${run.score} pts</div>`}
    <div class="kv">${daily ? '' : `<span>Stages cleared <b>${run.cleared}</b></span>`}${f ? `<span>+<b>${f.xpGained}</b> XP</span><span>Level <b>${f.level}</b></span>` : ''}${f && !daily ? `<span>Best <b>stage ${f.bestStage}</b> · ${f.bestScore} pts</span>` : ''}</div>
    ${f && f.newBest && !daily ? '<p class="good" style="margin:8px 0 0">New personal best!</p>' : ''}
    <div class="row">${daily ? '' : '<button id="again">Run again</button>'}<button class="ghost" id="lobbyBtn">Back to lobby</button></div>`;
  if (!daily) $('again').onclick = () => startRun();
  $('lobbyBtn').onclick = backToLobby;
}

async function backToLobby() {
  $('battle').classList.add('hidden'); $('lobby').classList.remove('hidden'); battle = null;
  try { await loadMe(); } catch { /* keep the old card */ }
}

async function startRun() { run = { score: 0, cleared: 0 }; try { await startStage('arena', 1); } catch (e) { $('status').textContent = e.message; } }
$('goArena').onclick = () => { sfx.unlock(); startRun(); };
$('goDaily').onclick = async () => {
  sfx.unlock(); run = { score: 0, cleared: 0 };
  try { await startStage('daily', 1); } catch (e) { $('status').textContent = e.message; $('status').className = 'note'; }
};
$('quit').onclick = async () => {
  if (battle && !battle.over && battle.mode === 'arena' && run.cleared > 0) await finishRun(true);
  await backToLobby();
};

// ---------- extras: expedition + narrated duel ----------
async function playDuel(duel) {
  sfx.clash(); await wait(450);
  for (const rd of duel.rounds) {
    if (rd.dodge) sfx.dodge(); else if (rd.crit) sfx.crit(); else sfx.hit();
    await wait(520);
    if (!rd.dodge) sfx.clash();
    await wait(260);
  }
}
async function loadCards() {
  const mine = $('mine').value, foe = $('foe').value;
  const [A, B] = await Promise.all([api('/api/chog/' + mine), api('/api/chog/' + foe)]);
  $('fighters').innerHTML = card(A.brain, A.nft, A.progress, A.art) + card(B.brain, B.nft, B.progress, B.art);
}
$('duel').onclick = async () => {
  sfx.unlock(); $('duel').disabled = true; $('status').textContent = 'Fighting…'; mood = {};
  try {
    const a = $('mine').value, b = $('foe').value;
    await loadCards();
    const r = await api('/api/duel', { a, b });
    $('story').style.display = 'block'; $('storyText').textContent = r.narration;
    $('by').textContent = 'Narrated by ' + (r.narratedBy === 'llm' ? 'Claude' : 'built-in commentator') + ' · winner: Chog #' + r.duel.winner;
    const loser = r.duel.winner === a ? b : a;
    await playDuel(r.duel);
    mood = { [r.duel.winner]: 'win', [loser]: 'cry' };
    await loadCards();
    sfx.win(); setTimeout(() => sfx.cry(), 900);
    $('status').innerHTML = `<span class="good">Chog #${esc(r.duel.winner)} wins.</span> Chog #${esc(loser)} is crying.`;
  } catch (e) { $('status').textContent = e.message; }
  $('duel').disabled = false;
};
$('run').onclick = async () => {
  try {
    const r = await api('/api/expedition/' + $('mine').value, {});
    $('status').innerHTML = `<span class="good">Your ${esc(r.temperament)} Chog found ${esc(r.found)}. +${r.xpGained} XP (Lv ${r.level}).</span>`;
    setTimeout(() => loadMe().catch(() => {}), 1000);
  } catch (e) { $('status').textContent = e.message; }
};
</script>
